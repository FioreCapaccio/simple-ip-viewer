name: Build desktop app

# Builds the Electron desktop wrapper natively on both macOS and Windows
# runners (no cross-compilation, no Wine). Artifacts are attached to the
# workflow run; on a pushed tag like "v1.0.0" they're also published as a
# draft GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist-script: dist:mac
            artifact-name: mac
            artifact-glob: |
              release/*.dmg
              release/*.zip
          - os: windows-latest
            dist-script: dist:win
            artifact-name: windows
            artifact-glob: |
              release/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and package (${{ matrix.artifact-name }})
        run: npm run ${{ matrix.dist-script }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: simple-ip-viewer-${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
